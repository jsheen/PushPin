# The Xcode project is generated from this file: `cd ios && xcodegen` (brew install xcodegen).
# PushPin.xcodeproj is gitignored; edit this file, not the project.
#
# Before running on a phone, set these two to yours (docs/ios-app.md):
#   DEVELOPMENT_TEAM   Apple Developer team id (Membership details)
#   PUSHPIN_BUNDLE_ID  the App ID you registered, e.g. com.<you>.pushpin
# and PUSHPIN_API_BASE to the card server (the Cloud Run URL, or the tunnel while testing).
# The server address can also be changed in the app, on the sign-in screen.
name: PushPin
options:
  deploymentTarget: {iOS: "17.0"}
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: ""
    PUSHPIN_BUNDLE_ID: com.example.pushpin
    PUSHPIN_API_BASE: https://pushpin-cards.example.run.app
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  PushPin:
    type: application
    platform: iOS
    sources: [PushPin]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PUSHPIN_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: PushPin/Info.plist
      properties:
        CFBundleDisplayName: PushPin
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        PushPinAPIBase: $(PUSHPIN_API_BASE)
    entitlements:
      path: PushPin/PushPin.entitlements
      properties:
        aps-environment: development   # Xcode switches this to production for TestFlight/App Store
        com.apple.developer.applesignin: [Default]
    dependencies:
      - target: PinNotification
  PinNotification:   # the long-press view of a push: the pin pressing into the story
    type: app-extension
    platform: iOS
    sources: [PinNotification]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PUSHPIN_BUNDLE_ID).pin
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: PinNotification/Info.plist
      properties:
        CFBundleDisplayName: PushPin
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.content-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationViewController
          NSExtensionAttributes:
            UNNotificationExtensionCategory: ARTICLE
            UNNotificationExtensionInitialContentSizeRatio: 0.55
            UNNotificationExtensionDefaultContentHidden: true
