services:
  train:
    build:
      context: .
      dockerfile: Dockerfile
    image: pushnyt-train:latest
    container_name: pushnyt-train
    env_file:
      - path: .env
        required: false
    environment:
      - DATA_DIR=/app/data
      - OUTPUT_DIR=/app/outputs
    volumes:
      - ./src:/app/src
      - ./configs:/app/configs
      - ./data:/app/data
      - ./outputs:/app/outputs
    command: ["pushnyt-train --config configs/train.yml"]
    shm_size: "2gb"   # PyTorch DataLoader workers need shared memory

  # Push objective: re-ranks a run's predictions.parquet. Needs only outputs/, not data/.
  objective:
    build:
      context: .
      dockerfile: Dockerfile.objective
    image: pushnyt-objective:latest
    container_name: pushnyt-objective
    volumes:
      - ./src:/app/src
      - ./configs:/app/configs
      - ./outputs:/app/outputs
    command: ["pushnyt-objective --config configs/objective.yml"]

  # Serving API on http://localhost:8000 (docs at /docs). PUSHNYT_RUN_DIR picks the run to serve.
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: pushnyt-api:latest
    container_name: pushnyt-api
    environment:
      - PUSHNYT_RUN_DIR=${PUSHNYT_RUN_DIR:-outputs/recency-depth-no-emb}
    volumes:
      - ./src:/app/src
      - ./configs:/app/configs:ro    # send policy from configs/objective.yml
      - ./outputs:/app/outputs:ro
    ports:
      - "8000:8000"
    restart: unless-stopped   # restarts if the process exits; health status shows in `docker ps`

  # Networked NYT simulation: two containers on the compose network. The push job reaches the
  # scoring service by its service name (http://scorer:8000); neither publishes a host port.
  #   docker compose up -d scorer        # loads model + MIND user state (~1-2 min until healthy)
  #   docker compose run --rm push-job   # waits for a healthy scorer, writes outputs/nyt-sim-http
  #   docker compose down
  scorer:
    build:
      context: .
      dockerfile: Dockerfile
    image: pushnyt-train:latest
    container_name: pushnyt-scorer
    environment:
      - DATA_DIR=/app/data
      - PUSHNYT_RUN_DIR=${PUSHNYT_SCORER_RUN:-outputs/ablation-with-llm}
      - MALLOC_ARENA_MAX=2          # fewer glibc arenas: less fragmentation from torch/xgboost threads
      - OMP_NUM_THREADS=2
      - TOKENIZERS_PARALLELISM=false
    # Docker Desktop's VM has 4 GB here. The cap makes an overrun kill only this container
    # (exit 137, `docker inspect` shows OOMKilled) instead of taking down the whole VM.
    # Stop the `api` service first if it's running: `docker compose stop api`.
    mem_limit: 2500m
    memswap_limit: 2500m
    volumes:
      - ./src:/app/src
      - ./configs:/app/configs
      - ./data:/app/data
      - ./outputs:/app/outputs:ro
    command: ["pushnyt-scorer"]
    expose:
      - "8000"   # reachable from other containers on the network only
    shm_size: "2gb"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 300s   # loading the MIND state takes a while

  push-job:
    build:
      context: .
      dockerfile: Dockerfile.objective
    image: pushnyt-objective:latest
    volumes:
      - ./src:/app/src
      - ./configs:/app/configs
      - ./outputs:/app/outputs
      - ./data/nyt-recent.csv:/app/data/nyt-recent.csv:ro   # the "news feed"
    depends_on:
      scorer:
        condition: service_healthy
    command: ["pushnyt-push-job --scorer http://scorer:8000 --out outputs/nyt-sim-http"]

  # Real pushes to phones (ntfy), with each push's card on :8090, public through the `tunnel` service.
  # Set NTFY_TOPIC in .env and subscribe to it in the ntfy app (friends can subscribe too).
  #   docker compose up -d scorer notifier tunnel
  #   docker compose run --rm notifier "python -m pushnyt.notifier --test"            # delivery check
  #   docker compose run --rm notifier "python -m pushnyt.notifier --once --dry-run"  # one slot, no send
  # Every candidate, its covariates and clicks go to outputs/notifier/pushes.db (SQLite).
  notifier:
    build:
      context: .
      dockerfile: Dockerfile.objective
    image: pushnyt-objective:latest
    container_name: pushnyt-notifier
    env_file:
      - path: .env
        required: false
    environment:
      - PUSHNYT_SCORER_URL=http://scorer:8000
      - TUNNEL_METRICS_URL=http://tunnel:2000   # card links use the tunnel's address unless CLICK_BASE_URL is set
    volumes:
      - ./src:/app/src
      - ./configs:/app/configs:ro
      - ./outputs:/app/outputs
    ports:
      - "127.0.0.1:8090:8090"   # the cards, for checking locally; phones go through the tunnel
    depends_on:
      scorer:
        condition: service_healthy
    mem_limit: 400m
    restart: unless-stopped
    command: ["python -m pushnyt.notifier"]

  # Public https address for the cards: a Cloudflare quick tunnel (free, no account). Its address
  # (https://<random>.trycloudflare.com) changes whenever it restarts, which breaks the card links of
  # pushes sent before; the notifier looks it up from the metrics endpoint at each send.
  tunnel:
    image: cloudflare/cloudflared:2025.11.1
    container_name: pushnyt-tunnel
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "--url", "http://notifier:8090"]
    mem_limit: 128m
    restart: unless-stopped

  # Interactive dev shell: `docker compose run --rm shell`
  shell:
    extends: train
    container_name: pushnyt-shell
    stdin_open: true
    tty: true
    command: ["bash"]
