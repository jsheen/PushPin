services:
  train:
    build:
      context: .
      dockerfile: Dockerfile
    image: pushpin-train:latest
    container_name: pushpin-train
    env_file:
      - path: .env
        required: false
    environment:
      - DATA_DIR=/app/data
      - OUTPUT_DIR=/app/outputs
    volumes:
      - ./src:/app/src
      - ./configs:/app/configs
      - ./data:/app/data
      - ./outputs:/app/outputs
    command: ["pushpin-train --config configs/train.yml"]
    shm_size: "2gb"   # PyTorch DataLoader workers need shared memory

  # Push objective: re-ranks a run's predictions.parquet. Needs only outputs/, not data/.
  objective:
    build:
      context: .
      dockerfile: Dockerfile.objective
    image: pushpin-objective:latest
    container_name: pushpin-objective
    volumes:
      - ./src:/app/src
      - ./configs:/app/configs
      - ./outputs:/app/outputs
    command: ["pushpin-objective --config configs/objective.yml"]

  # Serving API on http://localhost:8000 (docs at /docs). PUSHPIN_RUN_DIR picks the run to serve.
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: pushpin-api:latest
    container_name: pushpin-api
    environment:
      - PUSHPIN_RUN_DIR=${PUSHPIN_RUN_DIR:-outputs/recency-depth-no-emb}
    volumes:
      - ./src:/app/src
      - ./configs:/app/configs:ro    # send policy from configs/objective.yml
      - ./outputs:/app/outputs:ro
    ports:
      - "8000:8000"
    restart: unless-stopped   # restarts if the process exits; health status shows in `docker ps`

  # Networked NYT simulation: two containers on the compose network. The push job reaches the
  # scoring service by its service name (http://scorer:8000); neither publishes a host port.
  #   docker compose up -d scorer        # loads model + MIND user state (~1-2 min until healthy)
  #   docker compose run --rm push-job   # waits for a healthy scorer, writes outputs/nyt-sim-http
  #   docker compose down
  scorer:
    build:
      context: .
      dockerfile: Dockerfile
    image: pushpin-train:latest
    container_name: pushpin-scorer
    environment:
      - DATA_DIR=/app/data
      - PUSHPIN_RUN_DIR=${PUSHPIN_SCORER_RUN:-outputs/ablation-with-llm}
      - MALLOC_ARENA_MAX=2          # fewer glibc arenas: less fragmentation from torch/xgboost threads
      - OMP_NUM_THREADS=2
      - TOKENIZERS_PARALLELISM=false
    # Docker Desktop's VM has 4 GB here. The cap makes an overrun kill only this container
    # (exit 137, `docker inspect` shows OOMKilled) instead of taking down the whole VM.
    # Stop the `api` service first if it's running: `docker compose stop api`.
    mem_limit: 2500m
    memswap_limit: 2500m
    volumes:
      - ./src:/app/src
      - ./configs:/app/configs
      - ./data:/app/data
      - ./outputs:/app/outputs:ro
    command: ["pushpin-scorer"]
    expose:
      - "8000"   # reachable from other containers on the network only
    shm_size: "2gb"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 300s   # loading the MIND state takes a while

  push-job:
    build:
      context: .
      dockerfile: Dockerfile.objective
    image: pushpin-objective:latest
    volumes:
      - ./src:/app/src
      - ./configs:/app/configs
      - ./outputs:/app/outputs
      - ./data/nyt-recent.csv:/app/data/nyt-recent.csv:ro   # the "news feed"
    depends_on:
      scorer:
        condition: service_healthy
    command: ["pushpin-push-job --scorer http://scorer:8000 --out outputs/nyt-sim-http"]

  # Real pushes to phones (ntfy). Three services, matching the cloud layout (deploy/):
  #   notifier  the schedule: sleeps until each slot, scores, pushes   (cloud: Cloud Run job + Scheduler)
  #   cards     what a tapped push opens: Read / ♥ / Save, per reader   (cloud: Cloud Run service)
  #   tunnel    a public https address for the cards                    (cloud: Cloud Run's own URL)
  # Set NTFY_TOPIC in .env and subscribe to it in the ntfy app.
  # Both write to outputs/notifier/pushes.db, or to DATABASE_URL if set (e.g. the `db` service).
  #   docker compose up -d scorer notifier cards tunnel
  #   docker compose run --rm notifier "python -m pushpin.notifier --test"            # delivery check
  #   docker compose run --rm notifier "python -m pushpin.notifier --once --dry-run"  # one slot, no send
  # Every candidate, its covariates and clicks go to outputs/notifier/pushes.db (SQLite).
  notifier:
    build:
      context: .
      dockerfile: Dockerfile.objective
    image: pushpin-objective:latest
    container_name: pushpin-notifier
    env_file:
      - path: .env
        required: false
    environment:
      - PUSHPIN_SCORER_URL=http://scorer:8000
      - TUNNEL_METRICS_URL=http://tunnel:2000   # card links use the tunnel's address unless CLICK_BASE_URL is set
    volumes:
      - ./src:/app/src
      - ./configs:/app/configs:ro
      - ./outputs:/app/outputs
    depends_on:
      scorer:
        condition: service_healthy
    mem_limit: 400m
    restart: unless-stopped
    command: ["python -m pushpin.notifier"]

  cards:
    image: pushpin-objective:latest
    container_name: pushpin-cards
    env_file:
      - path: .env
        required: false
    volumes:
      - ./src:/app/src
      - ./configs:/app/configs:ro
      - ./outputs:/app/outputs
    ports:
      - "127.0.0.1:8090:8090"   # for checking locally; phones go through the tunnel
    mem_limit: 256m
    restart: unless-stopped
    command: ["python -m pushpin.cards"]

  # Public https address for the cards: a Cloudflare quick tunnel (free, no account). Its address
  # (https://<random>.trycloudflare.com) changes whenever it restarts, which breaks the card links of
  # pushes sent before; the notifier looks it up from the metrics endpoint at each send.
  tunnel:
    image: cloudflare/cloudflared:2025.11.1
    container_name: pushpin-tunnel
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "--url", "http://cards:8090"]
    mem_limit: 128m
    restart: unless-stopped

  # Local Postgres, the same database engine as Cloud SQL, for trying the cloud setup on the Mac:
  #   docker compose --profile postgres up -d db
  #   DATABASE_URL=postgresql+psycopg://pushpin:pushpin@db:5432/pushpin  (from containers)
  #   PUSHPIN_TEST_DATABASE_URL=postgresql+psycopg://pushpin:pushpin@localhost:5433/pushpin uv run pytest tests/test_notifier.py
  db:
    image: postgres:16.6-alpine
    container_name: pushpin-db
    profiles: ["postgres"]
    environment:
      - POSTGRES_USER=pushpin
      - POSTGRES_PASSWORD=pushpin   # local only; Cloud SQL's password lives in Secret Manager
      - POSTGRES_DB=pushpin
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pushpin-db:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "pushpin"]
      interval: 5s
      retries: 10

  # Interactive dev shell: `docker compose run --rm shell`
  shell:
    extends: train
    container_name: pushpin-shell
    stdin_open: true
    tty: true
    command: ["bash"]

volumes:
  pushpin-db:
