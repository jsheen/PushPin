[project]
name = "pushpin"
version = "0.1.0"
description = "Training pipeline and push objective for the PushPin model"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Core deps are all the objective image needs; the training image adds the `train` extra.
dependencies = [
    "matplotlib>=3.8",
    "numpy>=2.0",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "pyarrow>=16.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
train = [
    "anthropic>=1.0",
    "chromadb>=0.5",
    "scikit-learn>=1.5",
    "sentence-transformers>=3.0",
    "torch>=2.4",
    "tqdm>=4.66",
    "xgboost>=2.1",
]
api = [
    "fastapi>=0.115",
    "prometheus-client>=0.20",
    "uvicorn>=0.30",
]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.6",
    "ipython>=8.0",
]

[project.scripts]
pushpin-train = "pushpin.train:main"
pushpin-embed = "pushpin.embed:main"
pushpin-objective = "pushpin.objective:main"
pushpin-api = "pushpin.api:main"
pushpin-exploration = "pushpin.exploration:main"
pushpin-fatigue = "pushpin.fatigue:main"
pushpin-profile = "pushpin.profile:main"
pushpin-compare = "pushpin.compare:main"
pushpin-live-parity = "pushpin.live:main"
pushpin-nyt-sim = "pushpin.nyt:main"
pushpin-scorer = "pushpin.scorer_api:main"
pushpin-push-job = "pushpin.push_job:main"
pushpin-notifier = "pushpin.notifier:main"
pushpin-cards = "pushpin.cards:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pushpin"]

# Pull CPU-only torch wheels inside Linux containers (avoids ~2GB of CUDA libs).
# Remove this block (or point at a cu12x index) when building a GPU image.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # lets tests share helpers (from tests.test_push_job import FakeScorer)
