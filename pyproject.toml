[project]
name = "pushnyt"
version = "0.1.0"
description = "Training pipeline and push objective for the pushNYT model"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Core deps are all the objective image needs; the training image adds the `train` extra.
dependencies = [
    "matplotlib>=3.8",
    "numpy>=2.0",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "pyarrow>=16.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
train = [
    "anthropic>=1.0",
    "chromadb>=0.5",
    "scikit-learn>=1.5",
    "sentence-transformers>=3.0",
    "torch>=2.4",
    "tqdm>=4.66",
    "xgboost>=2.1",
]
api = [
    "fastapi>=0.115",
    "prometheus-client>=0.20",
    "uvicorn>=0.30",
]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.6",
    "ipython>=8.0",
]

[project.scripts]
pushnyt-train = "pushnyt.train:main"
pushnyt-embed = "pushnyt.embed:main"
pushnyt-objective = "pushnyt.objective:main"
pushnyt-api = "pushnyt.api:main"
pushnyt-exploration = "pushnyt.exploration:main"
pushnyt-fatigue = "pushnyt.fatigue:main"
pushnyt-profile = "pushnyt.profile:main"
pushnyt-compare = "pushnyt.compare:main"
pushnyt-live-parity = "pushnyt.live:main"
pushnyt-nyt-sim = "pushnyt.nyt:main"
pushnyt-scorer = "pushnyt.scorer_api:main"
pushnyt-push-job = "pushnyt.push_job:main"
pushnyt-notifier = "pushnyt.notifier:main"
pushnyt-cards = "pushnyt.cards:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pushnyt"]

# Pull CPU-only torch wheels inside Linux containers (avoids ~2GB of CUDA libs).
# Remove this block (or point at a cu12x index) when building a GPU image.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
