# The push card server on Cloud Run: what a tapped notification opens.
# Scales with taps, down to zero when nobody's tapping (free tier covers this traffic easily).
# ${...} placeholders are filled in by scripts/deploy-gcp.sh; deploy with
#   gcloud run services replace <filled-in file> --region ${REGION}
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: pushnyt-cards
  labels:
    app: pushnyt
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "5"
        run.googleapis.com/cloudsql-instances: ${SQL_INSTANCE}   # mounts the socket at /cloudsql/${SQL_INSTANCE}
    spec:
      serviceAccountName: pushnyt-run@${PROJECT}.iam.gserviceaccount.com
      containerConcurrency: 40
      timeoutSeconds: 30
      containers:
        - image: ${REGION}-docker.pkg.dev/${PROJECT}/pushnyt/objective:${TAG}
          args: ["python -m pushnyt.cards"]   # the image's entrypoint is bash -c
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: pushnyt-database-url, key: latest}
            - name: CARDS_STATS_TOKEN   # lets the scorer's autoscaler (KEDA, on GKE) read the reader count
              valueFrom:
                secretKeyRef: {name: pushnyt-stats-token, key: latest}
          resources:
            limits: {cpu: "1", memory: 512Mi}
          startupProbe:
            httpGet: {path: /health}
