# One notifier slot as a Cloud Run job: read the feeds, score, push, log, exit.
# Cloud Scheduler starts it at each slot hour (see scripts/deploy-gcp.sh), replacing the local
# container's sleep loop. It calls the private scorer service with an ID token from the metadata
# server (PUSHPIN_SCORER_AUTH=gcp) and reaches the database (Neon Postgres) over TLS.
# ${...} placeholders are filled in by scripts/deploy-gcp.sh; deploy with
#   gcloud run jobs replace <filled-in file> --region ${REGION}
apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: pushpin-notifier
  labels:
    app: pushpin
spec:
  template:
    spec:
      taskCount: 1
      template:
        spec:
          serviceAccountName: pushpin-run@${PROJECT}.iam.gserviceaccount.com
          maxRetries: 1
          timeoutSeconds: 1800   # includes the scorer's cold start
          containers:
            - image: ${REGION}-docker.pkg.dev/${PROJECT}/pushpin/objective:${TAG}
              args: ["python -m pushpin.notifier --once"]
              env:
                - name: PUSHPIN_SCORER_URL
                  value: ${SCORER_URL}     # the scorer's Cloud Run address (private)
                - name: PUSHPIN_SCORER_AUTH
                  value: gcp
                - name: CLICK_BASE_URL
                  value: ${CARDS_URL}      # the card service's https address
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef: {name: pushpin-database-url, key: latest}
                - name: NTFY_TOPIC
                  valueFrom:
                    secretKeyRef: {name: pushpin-ntfy-topic, key: latest}
              resources:
                limits: {cpu: "1", memory: 512Mi}
