# XGBoost click model on MIND: P(click | user, article, time slot)
seed: 42
data:
  dir: data
  behaviors: behaviors.tsv
  news: news.tsv
  entity_embeddings: entity_embedding.vec
split:
  # MIND-small train covers 2019-11-09 .. 2019-11-14
  fit_end: "2019-11-13"    # earlier impressions: complement stats + user history only
  train_end: "2019-11-14"  # [fit_end, train_end) trains the model; >= train_end is the test set
features:
  text_dim: 64             # TF-IDF -> SVD dimensions for article text
  ctr_prior_strength: 5    # pseudo-impressions shrinking a user's slot engagement rate to the global rate
  emb_top_k: 5             # emb_sim_top5: mean of the k most similar history articles
  emb_close_threshold: 0.5 # emb_n_close: history articles at or above this cosine similarity
  retrieval_k: 100         # emb_retrieval_rank: nearest articles retrieved per user
  exclude: []              # features to leave out, e.g. [sim_text] for an ablation
embeddings:
  model: sentence-transformers/all-MiniLM-L6-v2  # 384-dim; downloaded to data/models
  chroma_dir: chroma       # vector database, under data.dir
  collection: abstracts
  batch_size: 256
profile:                   # pushpin-profile: LLM click/skip themes per user and day (see profile.py)
  model: claude-haiku-5-5
  max_clicks: 10           # most recent clicks shown to the LLM
  skips_per_click: 2       # nearest skipped articles retrieved for each click
  max_words: 80            # abstract words per article in the prompt
  max_tokens: 600          # output cap per profile (headroom; themes need ~200)
  dir: llm                 # under data.dir: profiles.parquet, batches.json, report.json
  collection: profiles     # Chroma collection for the theme embeddings
model:
  n_estimators: 1000
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 5
  reg_lambda: 1            # XGBoost's defaults, written out so tuning can compare against them
  reg_alpha: 0
  gamma: 0
  early_stopping_rounds: 50
  valid_fraction: 0.2      # latest share of training rows used for early stopping
tuning:                    # random search over model params on the validation slice (see tuning.py)
  trials: 0                # 0 = train with model params as-is; pushpin-train --tune 25 overrides
  metric: group_auc        # valid_<metric> picks the winner: group_auc (within-impression ranking) or auc
  space:                   # [distribution, low, high]; int and uniform are uniform, log is uniform in log space
    max_depth: [int, 4, 10]
    min_child_weight: [log, 1, 50]
    subsample: [uniform, 0.5, 1.0]
    colsample_bytree: [uniform, 0.5, 1.0]
    reg_lambda: [log, 0.1, 100]
    reg_alpha: [log, 0.001, 10]
    gamma: [uniform, 0, 5]
risk:                      # return model (churn proxy): P(user has another impression within the horizon)
  horizon_hours: 24
  n_estimators: 200
  max_depth: 4
  learning_rate: 0.1
evaluation:
  bootstrap_samples: 1000  # impression-level bootstrap replicates for AUC CIs; 0 to skip
  ci_level: 0.95
  min_auc: 0.644           # quality gate: training fails below this test AUC (baseline CI lower bound)
output:
  dir: outputs/full        # each run gets its own folder under outputs/
